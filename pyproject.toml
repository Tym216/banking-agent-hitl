[project]
name = "banking-agent-hitl"
version = "0.1.0"
description = "Banking customer service agent with RAG, tool calling and human-in-the-loop approval"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "openai>=1.40",
    "pypdf>=4.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "mcp>=1.2",
    "pdfplumber>=0.10",
]

[project.optional-dependencies]
local-embedding = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
